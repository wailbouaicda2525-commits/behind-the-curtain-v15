name: Behind The Curtain — 4x Daily V15 Shorts

on:
  schedule:
    # 4 US Prime Time slots every day (07:00, 11:00, 15:00, 19:00 US EST)
    - cron: '0 12,16,20,0 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional Cold War / Secret History topic override (leave blank for auto)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run only (render without uploading to YouTube)'
        required: false
        default: 'false'
      privacy:
        description: 'YouTube privacy (public, unlisted, private)'
        required: false
        default: 'public'

permissions:
  contents: write

concurrency:
  group: btc-v15-shorts
  cancel-in-progress: false

jobs:
  publish-v15-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system FFmpeg & Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: Produce & Upload V15 BEAST Short (9:16)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          python3 run_daily_v15.py --topic "${{ github.event.inputs.topic || '' }}"

      - name: Save updated state (prevents duplicate topics)
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "V15 Beast Autopilot"
          git config user.email "autopilot@behindthecurtain.local"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "chore(btc): log published V15 Short [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push
          fi
