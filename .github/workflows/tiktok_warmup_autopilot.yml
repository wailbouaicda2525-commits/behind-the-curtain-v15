name: Behind The Curtain — TikTok 30-Day Auto Warm-Up Autopilot (Buffer Free)

on:
  # Triggered daily at 07:17 UTC (08:17 Algeria) via cron-job.org with count='auto'
  # AUTOMATIC 30-DAY ANTI-BOT WARM-UP FOR NEW BEHIND THE CURTAIN TIKTOK ACCOUNT (anchor: 2026-11-28):
  #   - Days 0-2   (Nov 28 - Nov 30): 0 videos (72h brand-new account warm-up window — exits in 2s!)
  #   - Days 3-9   (Dec 01 - Dec 07): 1 video every 2 days (Dec 1, 3, 5, 7) at random US/EU Peak Time
  #   - Days 10-17 (Dec 08 - Dec 15): 1 video/day at random US/EU Peak Time
  #   - Days 18-27 (Dec 16 - Dec 25): 2 videos/day (random 5h-8h spacing)
  #   - Day  28+   (Dec 26+):          3 videos/day FULL CRUISE!
  workflow_dispatch:
    inputs:
      count:
        description: "Publish mode: 'auto' (30-Day Smart Warm-Up) or manual '1'..'3'"
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1'
          - '2'
          - '3'
      dry_run:
        description: 'Dry run only (render without scheduling in Buffer)'
        required: false
        default: 'false'
      topic:
        description: 'Optional Cold War topic override'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: btc-tiktok-warmup
  cancel-in-progress: false

jobs:
  btc-tiktok-warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Evaluate 30-Day TikTok Anti-Bot Warm-Up Schedule
        id: warmup
        shell: python3 {0}
        env:
          REQ_COUNT: ${{ github.event.inputs.count || 'auto' }}
        run: |
          import os, datetime
          req = (os.environ.get("REQ_COUNT") or "auto").strip().lower()
          today = datetime.datetime.now(datetime.timezone.utc).date()
          anchor = datetime.date(2026, 11, 28)
          day_num = (today - anchor).days

          if req != "auto" and req.isdigit():
              cnt = int(req)
              phase = f"MANUAL OVERRIDE (count={cnt})"
          else:
              if day_num < 3:
                  cnt = 0
                  phase = f"Phase 0 New-Account Warm-Up Window (Day {day_num}/2 — starts Dec 1)"
              elif day_num <= 9:
                  cnt = 1 if (day_num % 2 == 1) else 0
                  phase = f"Phase 1 Gentle Warm-Up (Day {day_num}: 1 video every 2 days)"
              elif day_num <= 17:
                  cnt = 1
                  phase = f"Phase 2 Steady Trust (Day {day_num}: 1 video/day)"
              elif day_num <= 27:
                  cnt = 2
                  phase = f"Phase 3 Scale-Up (Day {day_num}: 2 videos/day)"
              else:
                  cnt = 3
                  phase = f"Phase 4 Full Cruise (Day {day_num}: 3 videos/day)"

          print(f"[BTC TIKTOK AUTO WARM-UP] Date={today} | {phase} -> count={cnt}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"count={cnt}\n")
              out.write(f"phase={phase}\n")

      - name: Checkout repository
        if: steps.warmup.outputs.count != '0'
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        if: steps.warmup.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system FFmpeg & Python dependencies
        if: steps.warmup.outputs.count != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: Produce & Schedule Behind The Curtain TikTok Video(s) via Buffer Free
        if: steps.warmup.outputs.count != '0'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python3 tiktok_buffer_v21.py --count "${{ steps.warmup.outputs.count }}" --topic "${{ github.event.inputs.topic || '' }}"

      - name: Save TikTok history state (conflict-safe)
        if: steps.warmup.outputs.count != '0' && (github.event.inputs.dry_run || 'false') != 'true'
        run: |
          git config user.name "BTC TikTok Autopilot"
          git config user.email "autopilot@behindthecurtain.local"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "chore(btc-tiktok): log TikTok warm-up batch [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break || sleep 4
            done
          fi
